<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Studio Wireless Headphones with soft memory-foam ear cups and up to 40 hours of listening.">
    <title>Studio Wireless Headphones | Sona Audio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container" aria-label="Brand">
        <a class="brand-mark" href="#top">sona<span>.</span></a>
      </nav>
    </header>

    <main id="top" class="container product-page">
      <section class="row g-4 g-lg-5 product-layout" aria-labelledby="product-title">
        <div class="col-12 col-lg-7">
          <div class="product-visual">
            <img class="product-image" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1400&q=85" alt="Black over-ear wireless headphones with a padded headband">
          </div>
        </div>

        <div class="col-12 col-lg-5">
          <div class="product-info">
            <p class="eyebrow">STUDIO SERIES</p>
            <h1 id="product-title" class="featured-product-title">Studio Wireless Headphones</h1>
            <p class="product-kicker">Over-ear · Wireless</p>
            <p class="price">₹15,999</p>
            <p class="description">Soft memory-foam ear cups and up to 40 hours of listening between charges. Made for long days at your desk, on the train, or wherever you put your music on.</p>

            <form id="buy" class="purchase-form">
              <div class="form-heading">
                <label for="finish">Color</label>
                <span class="finish-current"><span class="color-swatch" id="finish-swatch" aria-hidden="true"></span><span id="finish-name">Midnight Black</span></span>
              </div>
              <select class="form-select finish-select" id="finish" name="finish">
                <option value="Midnight Black">Midnight Black</option>
                <option value="Cloud White">Cloud White</option>
                <option value="Olive Green">Olive Green</option>
              </select>

              <div class="quantity-row">
                <label for="quantity">Quantity</label>
                <div class="quantity-control">
                  <button class="quantity-button" type="button" data-step="-1" aria-label="Decrease quantity">−</button>
                  <input id="quantity" name="quantity" type="number" min="1" max="10" value="1" inputmode="numeric" aria-label="Quantity">
                  <button class="quantity-button" type="button" data-step="1" aria-label="Increase quantity">+</button>
                </div>
              </div>

              <button class="btn add-button" type="submit">Add to Cart</button>
              <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
